# Releases the plugin from its tag: builds it, attests the files Obsidian
# installs, and creates the GitHub release that carries them.
#
# Built here rather than on a maintainer's machine so that the build is one
# anybody can repeat and check. The Community plugins directory rebuilds the
# plugin from the tagged source and compares its main.js with the released
# one, and asks for GitHub artifact attestations on the release's files.
#
# The tag is pushed by `npm run release:github -- <x.y.z>` (RELEASING.md),
# which checks the same things first, with the same script.
name: Release

on:
  push:
    # The bare version, as the directory looks the release up: 0.2.5, not
    # v0.2.5.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that origin/main is there to check against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release is of a commit main has: a tag pushed on a branch's commit
      # would release code no pull request merged.
      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME tags $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The version, the manifest, versions.json and the changelog entry, and
      # the notes the release carries; then main.js carries the frame it was
      # built with.
      - name: Check the release
        run: |
          bash scripts/release-checks.sh "$GITHUB_REF_NAME" --notes notes.md
          bash scripts/release-checks.sh --built

      # Signed statements, kept by GitHub, that these exact files came out of
      # this workflow run on this commit. `gh attestation verify` checks them.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The three files the directory installs, and nothing else: it reports
      # any other file on a release as unsupported.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "DBML Studio for Obsidian $GITHUB_REF_NAME"
          --notes-file notes.md
          main.js manifest.json styles.css
